<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images | WDD 131</title>
    <meta name="description" content="Demonstration of native browser lazy loading images for WDD 131.">
    <meta name="author" content="Sitso Ashiadey">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Demonstration</h1>

        <!-- 6 Stacked Images with loading="lazy" and fixed portrait dimensions -->
        <img src="https://picsum.photos/400/600?random=1" alt="Random placeholder image 1" loading="lazy" width="400"
            height="600">
        <img src="https://picsum.photos/400/600?random=2" alt="Random placeholder image 2" loading="lazy" width="400"
            height="600">
        <img src="https://picsum.photos/400/600?random=3" alt="Random placeholder image 3" loading="lazy" width="400"
            height="600">
        <img src="https://picsum.photos/400/600?random=4" alt="Random placeholder image 4" loading="lazy" width="400"
            height="600">
        <img src="https://picsum.photos/400/600?random=5" alt="Random placeholder image 5" loading="lazy" width="400"
            height="600">
        <img src="https://picsum.photos/400/600?random=6" alt="Random placeholder image 6" loading="lazy" width="400"
            height="600">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Sitso Ashiadey | Ghana</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
